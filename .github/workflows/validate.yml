name: Validate Piko Label Printer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate syntax and expected files
        run: |
          set -e
          test -f public/index.html
          test -f public/app.js
          test -f api/orders.js
          test -f api/documents/labels.js
          node --check public/app.js
          node --check public/munbyn-direct.js
          node --check lib/api.mjs
          for f in api/*.js api/oauth/*.js api/documents/*.js; do node --check "$f"; done
      - name: Verify remembered-browser session, renewal and logout
        run: node --test tests/session.test.mjs
      - name: Test direct Bluetooth TSPL encoder
        run: node --test tests/munbyn-direct.test.mjs
      - name: Generate PDFs
        run: |
          node --input-type=module -e '
          import {labelsPdf, packingPdf, calibrationPdf} from "./pdf.mjs";
          const o={id:"test",displayId:"test",buyer:"buyer",shipTo:{name:"Test Person",line1:"1 Main St",cityStatePostal:"Toronto ON",country:"Canada"},items:[{title:"Card",quantity:1}],total:{value:"2",currency:"CAD"}};
          const settings={storeName:"Piko Cards",returnName:"Piko Cards",returnAddress:{line1:"1 Test Rd",cityStatePostal:"Sorel QC",country:"Canada"},labelWidth:2.25,labelHeight:1.25};
          for(const buf of [labelsPdf([o],settings),packingPdf([o],settings),calibrationPdf(settings)]) if(!buf.toString("ascii",0,8).startsWith("%PDF-1.")) process.exit(1);
          console.log("PDF smoke tests passed");
          '
